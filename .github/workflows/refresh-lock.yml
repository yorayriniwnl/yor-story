name: Refresh dependency lock

on:
  push:
    branches:
      - chore/repo-hygiene-20261001
    paths:
      - ".github/workflows/refresh-lock.yml"
      - "package.json"
      - "lib/reflections.ts"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-hygiene-20261001
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Install validated tree
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Design contract
        run: npm run design:check
      - name: Tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
        run: npm run build
      - name: Commit validated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency update required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "deps: refresh validated dependency lock"
          git push origin HEAD:chore/repo-hygiene-20261001